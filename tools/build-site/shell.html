<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>


<title>CEX 交易所学习站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed chapter rail on the left (drawer on phones), one reading column, labs open full-height in place. */
:root {
  --ground: #f6f5f1;
  --paper: #fffefb;
  --ink: #1d1c19;
  --ink-2: #5d5a52;
  --rule: #e4e1d8;
  --tint: #efece4;
  --gold: #b38300;
  --gold-soft: #f8edcc;
  --buy: #0e8f63; --buy-soft: #dcf2e7;
  --sell: #c93246; --sell-soft: #fae1e5;
  --info: #2f66c9; --info-soft: #e3ebf9;
  --warn: #b65f00; --warn-soft: #fbead0;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --rail: 288px;
  --bar: 52px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
    --gold: #f0b90b; --gold-soft: #3a3010;
    --buy: #2ebd85; --buy-soft: #12352a; --sell: #f6465d; --sell-soft: #3d1a20;
    --info: #7ba5f5; --info-soft: #1a2640; --warn: #f0a340; --warn-soft: #3b2a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #131311; --paper: #1a1a17; --ink: #ebe9e2; --ink-2: #a5a298; --rule: #2f2e29; --tint: #23221e;
  --gold: #f0b90b; --gold-soft: #3a3010;
  --buy: #2ebd85; --buy-soft: #12352a; --sell: #f6465d; --sell-soft: #3d1a20;
  --info: #7ba5f5; --info-soft: #1a2640; --warn: #f0a340; --warn-soft: #3b2a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.8; -webkit-font-smoothing: antialiased; }
a { color: var(--info); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--bar); display: flex; align-items: center; gap: 12px; padding-inline: 16px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--f-display); font-weight: 800; font-size: 17px; letter-spacing: .02em; white-space: nowrap; }
.brand .tick { font-family: var(--f-mono); font-size: 11px; color: var(--gold); letter-spacing: .08em; white-space: nowrap; }
.bar .spacer { flex: 1; }
.icon-btn { font: inherit; font-size: 14px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); border-radius: 8px; height: 34px; padding-inline: 10px; cursor: pointer; }
.icon-btn:hover { border-color: var(--gold); }
#menuBtn { display: none; }

/* shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100% - var(--bar)); }
.rail { position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); height: calc(100vh - var(--bar)); overflow-y: auto; border-right: 1px solid var(--rule); background: var(--paper); padding: 14px 12px 40px; }
.search { width: 100%; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); color: var(--ink); }
.group { margin-top: 18px; }
.group h4 { margin: 0 0 4px; padding-inline: 8px; font-size: 11px; font-weight: 600; letter-spacing: .1em; color: var(--ink-2); text-transform: uppercase; }
.navlink { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 4px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 14px; line-height: 1.5; }
.navlink .code { font-family: var(--f-mono); font-size: 11px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.navlink:hover { background: var(--tint); }
.navlink[aria-current="page"] { background: var(--gold-soft); }
.navlink[aria-current="page"] .code { color: var(--gold); font-weight: 600; }

/* reading column */
main { min-width: 0; padding-inline: 16px; }
.doc { max-width: 780px; margin: 0 auto; padding-block: 32px 80px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; color: var(--gold); letter-spacing: .08em; margin-bottom: 6px; }
.doc h1, .doc h2, .doc h3 { font-family: var(--f-display); text-wrap: balance; line-height: 1.35; }
.doc h1 { font-size: 32px; font-weight: 800; margin: 0 0 18px; letter-spacing: .01em; }
.doc h2 { font-size: 23px; font-weight: 800; margin: 48px 0 12px; padding-top: 18px; border-top: 1px solid var(--rule); }
.doc h3 { font-size: 18px; font-weight: 600; margin: 30px 0 8px; }
.doc h4 { font-size: 16px; margin: 22px 0 6px; }
.doc p, .doc li { max-width: 68ch; }
.doc ul, .doc ol { padding-left: 1.4em; }
.doc li { margin: 2px 0; }
.doc strong { font-weight: 650; }
.doc hr { border: 0; border-top: 1px solid var(--rule); margin: 32px 0; }
.doc code { font-family: var(--f-mono); font-size: .86em; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.code-wrap { overflow-x: auto; background: var(--tint); border-radius: 8px; margin: 14px 0; }
.code-wrap pre { margin: 0; padding: 12px 14px; font-size: 13px; line-height: 1.6; }
.code-wrap code { background: none; padding: 0; }
.table-wrap { overflow-x: auto; margin: 16px 0; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); }
.doc table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.6; }
.doc th, .doc td { padding: 8px 12px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--rule); }
.doc tr:last-child td { border-bottom: 0; }
.doc th { background: var(--tint); font-weight: 600; white-space: nowrap; }
.doc td { font-variant-numeric: tabular-nums; }

blockquote { margin: 16px 0; padding: 10px 16px; border-radius: 8px; background: var(--tint); color: var(--ink); }
blockquote p { margin: 6px 0; }
blockquote.warn { background: var(--warn-soft); }
blockquote.info { background: var(--info-soft); }
blockquote.analogy { background: var(--gold-soft); }
blockquote.deep { background: transparent; border: 1px dashed var(--rule); }

.repo-path { font-family: var(--f-mono); font-size: .86em; color: var(--ink-2); border-bottom: 1px dotted var(--ink-2); cursor: help; }
a.repo-path { color: var(--info); text-decoration: none; cursor: pointer; }
a.repo-path::after { content: " ↗"; font-size: .8em; color: var(--ink-2); }
a.lab-link::after { content: " ▸"; font-size: .8em; color: var(--gold); }

.mmd-wrap { margin: 18px 0; padding: 16px; overflow-x: auto; background: var(--paper); border: 1px solid var(--rule); border-radius: 10px; }
.mmd-wrap pre.mmd { margin: 0; font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); white-space: pre-wrap; }
.mmd-wrap svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.mmd-wrap.wide svg { max-width: none; }
.mmd-wrap.ready { position: relative; cursor: zoom-in; transition: border-color .15s; }
.mmd-wrap.ready:hover, .mmd-wrap.ready:focus-visible { border-color: var(--gold); }
.mmd-wrap .zoom-chip { position: absolute; top: 8px; right: 8px; padding: 3px 10px; font-size: 12px; line-height: 1.6; border-radius: 999px; background: var(--gold-soft); color: var(--ink); border: 1px solid var(--rule); opacity: .85; pointer-events: none; }
.mmd-wrap.ready:hover .zoom-chip { opacity: 1; border-color: var(--gold); }

/* diagram viewer: full-screen, pan + zoom */
.viewer { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: var(--ground); }
.viewer[hidden] { display: none; }
.viewer-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 10px; background: var(--paper); border-bottom: 1px solid var(--rule); }
.viewer-bar .vt { flex: 1 1 200px; min-width: 0; font-family: var(--f-display); font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.viewer-bar .zoomv { font-family: var(--f-mono); font-size: 13px; min-width: 52px; text-align: center; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.viewer-bar .vbtn { font: inherit; font-size: 14px; min-width: 36px; height: 34px; padding-inline: 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); cursor: pointer; }
.viewer-bar .vbtn:hover { border-color: var(--gold); }
.viewer-bar .vclose { background: var(--tint); }
.viewer-hint { width: 100%; font-size: 12px; color: var(--ink-2); }
.viewer-port { position: relative; flex: 1; overflow: hidden; cursor: grab; touch-action: none; background:
  radial-gradient(circle, var(--rule) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--ground); }
.viewer-port.dragging { cursor: grabbing; }
.viewer-stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.viewer-stage svg { display: block; max-width: none !important; background: var(--paper); border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
@media (max-width: 600px) { .viewer-hint { display: none; } .viewer-bar .vt { flex-basis: 100%; } }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 56px; }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 10px; text-decoration: none; color: var(--ink); background: var(--paper); min-width: 0; }
.pager a:hover { border-color: var(--gold); }
.pager .k { font-size: 12px; color: var(--ink-2); }
.pager .t { font-weight: 600; font-size: 14px; }
.pager .next { text-align: right; grid-column: 2; }

/* labs */
.labs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
.lab-card { display: flex; flex-direction: column; gap: 4px; padding: 14px; border: 1px solid var(--rule); border-radius: 10px; background: var(--paper); text-decoration: none; color: var(--ink); }
.lab-card:hover { border-color: var(--gold); }
.lab-card .from { font-family: var(--f-mono); font-size: 11px; color: var(--gold); }
.lab-card .t { font-weight: 600; }
.labview { display: flex; flex-direction: column; height: calc(100vh - var(--bar)); }
.labhead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 10px 0; }
.labhead h1 { font-family: var(--f-display); font-size: 20px; margin: 0; }
.labhead .muted { font-size: 13px; color: var(--ink-2); }
.labframe { flex: 1; width: 100%; border: 1px solid var(--rule); border-radius: 10px 10px 0 0; background: var(--ground); }

.results { margin-top: 10px; }
.result { display: block; padding: 8px; border-radius: 6px; text-decoration: none; color: var(--ink); font-size: 13px; line-height: 1.5; }
.result:hover { background: var(--tint); }
.result b { display: block; font-size: 14px; }
.result span { color: var(--ink-2); }
.result mark { background: var(--gold-soft); color: var(--ink); }

@media (max-width: 900px) {
  #menuBtn { display: inline-block; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; z-index: 25; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); left: 0; width: min(88vw, 320px); transform: translateX(-102%); transition: transform .2s ease; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  body.menu-open .rail { transform: none; }
  .doc h1 { font-size: 26px; }
  .doc h2 { font-size: 20px; }
  .brand .tick { display: none; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }
</style>

<header class="bar">
  <button class="icon-btn" id="menuBtn" aria-label="打开目录">☰ 目录</button>
  <a class="brand" href="#home" data-nav="home"><b>CEX 交易所学习手册</b><span class="tick">BINANCE · CASE STUDY</span></a>
  <span class="spacer"></span>
  <a class="icon-btn" href="#labs" data-nav="labs" style="display:inline-flex;align-items:center;text-decoration:none">交互实验</a>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="章节目录">
    <input class="search" id="q" type="search" placeholder="搜索全部章节，例如：强平、对账、Travel Rule" autocomplete="off">
    <div class="results" id="results" hidden></div>
    <div id="navGroups"></div>
  </nav>
  <main id="main"><article class="doc" id="view"></article></main>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="viewer-bar">
    <span class="vt" id="viewerTitle">流程图</span>
    <button class="vbtn" id="vOut" aria-label="缩小">−</button>
    <span class="zoomv" id="vZoom">100%</span>
    <button class="vbtn" id="vIn" aria-label="放大">+</button>
    <button class="vbtn" id="v100">1:1</button>
    <button class="vbtn vfit" id="vFit">适应屏幕</button>
    <button class="vbtn vclose" id="vClose" aria-label="关闭">✕ 关闭</button>
    <span class="viewer-hint">拖拽或滚轮平移 · Ctrl+滚轮 / 双指捏合 / + − 缩放 · 双击放大 · 0 适应屏幕 · Esc 关闭</span>
  </div>
  <div class="viewer-port" id="viewerPort"><div class="viewer-stage" id="viewerStage"></div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/11.15.0/mermaid.min.js"></script>
<script>
const DATA = __DATA__;
const { docs, nav, labs, mdMap } = DATA;
const order = nav.flatMap(g => g.items);
const groupName = Object.fromEntries(nav.map(g => [g.key, g.name]));
const codeOf = id => id === 'home' ? '·' : id === 'guide' ? '规范' : id === 'products' ? 'P' : id === 'backstage' ? 'B' : id.toUpperCase().replace(/^C/, '');
const shortTitle = t => t.replace(/^(\d\d|P\d\d|B\d\d)\s*/, '').replace(/^CEX 交易所系统学习材料（以币安为例）$/, '学习路径总览');

// ---------- sidebar ----------
const navEl = document.getElementById('navGroups');
navEl.innerHTML = nav.map(g => `<div class="group"><h4>${g.name}</h4>${g.items.map(id =>
  `<a class="navlink" href="#${id}" data-nav="${id}"><span class="code">${codeOf(id)}</span><span>${shortTitle(docs[id].title)}</span></a>`).join('')}</div>`).join('')
  + `<div class="group"><h4>交互实验 · ${labs.length} 个</h4>${labs.map(l =>
  `<a class="navlink" href="#${l.id}" data-nav="${l.id}"><span class="code">LAB</span><span>${l.title}</span></a>`).join('')}</div>`;

// ---------- mermaid ----------
const isDark = () => {
  const t = document.documentElement.getAttribute('data-theme');
  return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
};
let mmdTheme = null, mmdSeq = 0;
function initMermaid() {
  const dark = isDark();
  if (mmdTheme === dark) return;
  mmdTheme = dark;
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();
  mermaid.initialize({
    startOnLoad: false, securityLevel: 'strict', theme: 'base',
    fontFamily: '-apple-system, "PingFang SC", "Microsoft YaHei", sans-serif',
    themeVariables: {
      darkMode: dark, background: v('--paper'), fontSize: '14px',
      primaryColor: v('--gold-soft'), primaryBorderColor: v('--gold'), primaryTextColor: v('--ink'),
      secondaryColor: v('--info-soft'), tertiaryColor: v('--tint'),
      lineColor: v('--ink-2'), textColor: v('--ink'), mainBkg: v('--gold-soft'),
      clusterBkg: v('--tint'), clusterBorder: v('--rule'), titleColor: v('--ink'),
      edgeLabelBackground: v('--paper'), noteBkgColor: v('--info-soft'), noteTextColor: v('--ink'), noteBorderColor: v('--info'),
      actorBkg: v('--gold-soft'), actorBorder: v('--gold'), actorTextColor: v('--ink'), signalColor: v('--ink-2'), signalTextColor: v('--ink'),
      labelBoxBkgColor: v('--tint'), labelTextColor: v('--ink'), loopTextColor: v('--ink'), activationBkgColor: v('--tint'),
    },
  });
}
async function renderMermaid(root) {
  if (!window.mermaid) return;
  initMermaid();
  for (const pre of root.querySelectorAll('pre.mmd')) {
    const wrap = pre.parentElement;
    const src = pre.dataset.src || pre.textContent;
    pre.dataset.src = src;
    try {
      const { svg } = await mermaid.render('m' + (++mmdSeq), src);
      const holder = document.createElement('div');
      holder.innerHTML = svg;
      const el = holder.firstElementChild;
      wrap.querySelectorAll('svg').forEach(s => s.remove());
      pre.hidden = true;
      wrap.appendChild(el);
      const w = parseFloat(el.style.maxWidth) || 0;
      wrap.classList.toggle('wide', w > 900);
      if (!wrap.classList.contains('ready')) {
        wrap.classList.add('ready');
        wrap.tabIndex = 0;
        wrap.setAttribute('role', 'button');
        wrap.setAttribute('aria-label', '放大查看流程图');
        const chip = document.createElement('span');
        chip.className = 'zoom-chip';
        chip.textContent = '⤢ 点击放大';
        wrap.prepend(chip);
      }
    } catch (e) { pre.hidden = false; }
  }
}
function rerenderForTheme() { if (mmdTheme !== null && mmdTheme !== isDark()) { viewer.close(); mmdTheme = null; renderMermaid(view); } }

// ---------- diagram viewer: click a diagram to open it full screen, then pan and zoom ----------
const viewer = (() => {
  const box = document.getElementById('viewer'), port = document.getElementById('viewerPort'), stage = document.getElementById('viewerStage');
  const zoomLabel = document.getElementById('vZoom'), titleEl = document.getElementById('viewerTitle');
  let svg = null, home = null, opener = null, w = 0, h = 0, s = 1, x = 0, y = 0;
  const MIN = 0.1, MAX = 8;
  const apply = () => { stage.style.transform = `translate(${x}px, ${y}px) scale(${s})`; zoomLabel.textContent = Math.round(s * 100) + '%'; };
  const rect = () => port.getBoundingClientRect();
  function zoomAt(f, cx, cy) {
    const ns = Math.min(MAX, Math.max(MIN, s * f));
    x = cx - (cx - x) * ns / s; y = cy - (cy - y) * ns / s; s = ns; apply();
  }
  const zoomCenter = f => { const r = rect(); zoomAt(f, r.width / 2, r.height / 2); };
  function fit() {
    const r = rect(), pad = 24;
    s = Math.min(MAX, Math.max(MIN, Math.min((r.width - pad * 2) / w, (r.height - pad * 2) / h)));
    x = (r.width - w * s) / 2; y = (r.height - h * s) / 2; apply();
  }
  // First view: fit the whole diagram, unless that makes it too small to read (wide diagrams on phones).
  // Then start at a readable size from the left edge and let the reader pan.
  function initial() {
    fit();
    if (s >= 0.45) return;
    const r = rect();
    s = 0.6;
    x = 16; y = Math.max(16, (r.height - h * s) / 2); apply();
  }
  function actual() { const r = rect(); s = 1; x = (r.width - w) / 2; y = Math.max(24, (r.height - h) / 2); apply(); }
  function titleFor(wrap) {
    let n = wrap.previousElementSibling;
    while (n && !/^H[1-4]$/.test(n.tagName)) n = n.previousElementSibling;
    const doc = view.querySelector('h1');
    return [doc && doc.textContent, n && n.textContent].filter(Boolean).join(' · ') || '流程图';
  }
  function open(wrap) {
    const el = wrap.querySelector('svg');
    if (!el) return;
    const vb = (el.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    const bb = el.getBoundingClientRect();
    w = vb[2] || bb.width; h = vb[3] || bb.height;
    svg = el; opener = wrap; home = { parent: el.parentNode, next: el.nextSibling, style: el.getAttribute('style'), width: el.getAttribute('width'), height: el.getAttribute('height') };
    el.setAttribute('width', w); el.setAttribute('height', h); el.style.maxWidth = 'none';
    stage.appendChild(el);
    titleEl.textContent = titleFor(wrap);
    box.hidden = false;
    document.documentElement.style.overflow = 'hidden';
    initial();
    document.getElementById('vClose').focus();
  }
  function close() {
    if (box.hidden) return;
    if (svg && home) {
      home.style === null ? svg.removeAttribute('style') : svg.setAttribute('style', home.style);
      home.width === null ? svg.removeAttribute('width') : svg.setAttribute('width', home.width);
      home.height === null ? svg.removeAttribute('height') : svg.setAttribute('height', home.height);
      home.parent.insertBefore(svg, home.next);
    }
    box.hidden = true; svg = null;
    document.documentElement.style.overflow = '';
    if (opener && document.contains(opener)) opener.focus({ preventScroll: true });
  }

  // wheel: pan by default (scrolling), zoom with Ctrl/⌘ or a trackpad pinch (which arrives as ctrl+wheel)
  port.addEventListener('wheel', e => {
    e.preventDefault();
    const r = rect();
    if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-Math.max(-25, Math.min(25, e.deltaY)) * 0.01), e.clientX - r.left, e.clientY - r.top); // a mouse notch ≈ ×1.28; trackpad pinch stays smooth
    else { x -= e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX; y -= e.shiftKey && !e.deltaX ? 0 : e.deltaY; apply(); }
  }, { passive: false });

  // pointer: one pointer drags, two pointers pinch
  const pts = new Map();
  let last = null;
  port.addEventListener('pointerdown', e => {
    port.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    port.classList.add('dragging');
    last = null;
  });
  port.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 1) { x += e.clientX - prev.x; y += e.clientY - prev.y; apply(); return; }
    const [a, b] = [...pts.values()], r = rect();
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2 - r.left, my = (a.y + b.y) / 2 - r.top;
    if (last) { x += mx - last.mx; y += my - last.my; zoomAt(d / last.d, mx, my); }
    last = { d, mx, my };
  });
  const up = e => { pts.delete(e.pointerId); last = null; if (!pts.size) port.classList.remove('dragging'); };
  port.addEventListener('pointerup', up);
  port.addEventListener('pointercancel', up);
  port.addEventListener('dblclick', e => { const r = rect(); zoomAt(2, e.clientX - r.left, e.clientY - r.top); });

  document.getElementById('vIn').addEventListener('click', () => zoomCenter(1.25));
  document.getElementById('vOut').addEventListener('click', () => zoomCenter(0.8));
  document.getElementById('vFit').addEventListener('click', fit);
  document.getElementById('v100').addEventListener('click', actual);
  document.getElementById('vClose').addEventListener('click', close);
  addEventListener('resize', () => { if (!box.hidden) fit(); });
  document.addEventListener('keydown', e => {
    if (box.hidden) {
      const wrap = e.target.closest && e.target.closest('.mmd-wrap.ready');
      if (wrap && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); open(wrap); }
      return;
    }
    const k = e.key, step = 60;
    if (k === 'Escape') close();
    else if (k === '+' || k === '=') zoomCenter(1.25);
    else if (k === '-' || k === '_') zoomCenter(0.8);
    else if (k === '0') fit();
    else if (k === 'ArrowLeft') { x += step; apply(); }
    else if (k === 'ArrowRight') { x -= step; apply(); }
    else if (k === 'ArrowUp') { y += step; apply(); }
    else if (k === 'ArrowDown') { y -= step; apply(); }
    else if (k === 'Tab') { // keep focus inside the dialog
      const f = [...box.querySelectorAll('button')]; const i = f.indexOf(document.activeElement);
      e.preventDefault(); f[(i + (e.shiftKey ? f.length - 1 : 1)) % f.length].focus();
      return;
    } else return;
    e.preventDefault();
  });
  document.addEventListener('click', e => {
    const wrap = e.target.closest && e.target.closest('.mmd-wrap.ready');
    if (wrap && !box.contains(wrap) && !getSelection().toString()) open(wrap);
  });
  return { open, close };
})();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rerenderForTheme);
new MutationObserver(rerenderForTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------- routing ----------
const view = document.getElementById('view');
function setCurrent(id) {
  document.querySelectorAll('.navlink').forEach(a => {
    if (a.dataset.nav === id) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}
function showDoc(id) {
  const d = docs[id];
  const i = order.indexOf(id);
  const prev = order[i - 1], next = order[i + 1];
  view.className = 'doc';
  view.innerHTML = `<div class="eyebrow">${groupName[d.group]}</div>${d.html}
    <nav class="pager">${prev ? `<a href="#${prev}" data-nav="${prev}"><span class="k">← 上一篇</span><span class="t">${shortTitle(docs[prev].title)}</span></a>` : ''}
    ${next ? `<a class="next" href="#${next}" data-nav="${next}"><span class="k">下一篇 →</span><span class="t">${shortTitle(docs[next].title)}</span></a>` : ''}</nav>`;
  renderMermaid(view);
}
function showLabs() {
  view.className = 'doc';
  view.innerHTML = `<div class="eyebrow">交互实验</div><h1>亲手验证，而不是只读结论</h1>
    <p>每个实验对应一章。拖动滑块、点击按钮，观察系统在不同参数和状态下怎样运行。所有参数都是示例值，不代表币安实时参数。</p>
    <div class="labs-grid">${labs.map(l => `<a class="lab-card" href="#${l.id}" data-nav="${l.id}"><span class="from">LAB</span><span class="t">${l.title}</span></a>`).join('')}</div>`;
}
function showLab(id) {
  const l = labs.find(x => x.id === id);
  view.className = 'labview';
  view.innerHTML = `<div class="labhead"><h1>${l.title}</h1><span class="muted">交互实验 · 页面内的链接会带你回到对应章节</span></div>
    <iframe class="labframe" src="interactive/${l.file}" title="${l.title}"></iframe>`;
}
function route() {
  viewer.close();
  const id = (location.hash || '#home').slice(1);
  document.body.classList.remove('menu-open');
  if (docs[id]) showDoc(id);
  else if (id === 'labs') showLabs();
  else if (labs.some(l => l.id === id)) showLab(id);
  else { showDoc('home'); }
  setCurrent(id);
  if (!id.startsWith('lab')) window.scrollTo(0, 0);
}
function go(id) { if (location.hash === '#' + id) route(); else location.hash = id; }
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav]');
  if (a) { e.preventDefault(); go(a.dataset.nav); }
});
window.addEventListener('hashchange', route);
window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.cexNav) go(m.cexNav);
  else if (m.cexNavMd) { const id = mdMap['../' + m.cexNavMd.split('#')[0].replace(/^(\.\.\/)+/, '')]; if (id) go(id); }
});
document.getElementById('menuBtn').addEventListener('click', () => document.body.classList.toggle('menu-open'));

// ---------- search ----------
const plain = Object.fromEntries(Object.values(docs).map(d => [d.id, d.html.replace(/<[^>]+>/g, ' ').replace(/&[a-z]+;/g, ' ').replace(/\s+/g, ' ')]));
const q = document.getElementById('q'), results = document.getElementById('results');
const escHtml = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
q.addEventListener('input', () => {
  const term = q.value.trim();
  if (!term) { results.hidden = true; navEl.hidden = false; return; }
  const low = term.toLowerCase();
  const hits = [];
  for (const id of order) {
    const text = plain[id]; const idx = text.toLowerCase().indexOf(low);
    const inTitle = docs[id].title.toLowerCase().includes(low);
    if (idx < 0 && !inTitle) continue;
    const count = text.toLowerCase().split(low).length - 1;
    const s = Math.max(0, idx - 24);
    const snip = idx < 0 ? '' : escHtml(text.slice(s, idx)) + '<mark>' + escHtml(text.slice(idx, idx + term.length)) + '</mark>' + escHtml(text.slice(idx + term.length, idx + term.length + 40));
    hits.push({ id, score: (inTitle ? 1000 : 0) + count, snip, count });
  }
  hits.sort((a, b) => b.score - a.score);
  results.hidden = false; navEl.hidden = true;
  results.innerHTML = hits.length ? hits.slice(0, 30).map(h => `<a class="result" href="#${h.id}" data-nav="${h.id}"><b>${codeOf(h.id)} · ${shortTitle(docs[h.id].title)} <span>(${h.count})</span></b><span>${h.snip}</span></a>`).join('')
    : '<p class="result"><span>没有找到。换一个词试试，例如"保证金"。</span></p>';
});

route();
</script>

<script>
window.LL_ANSWERS = {"b01": ["你应该看到被误报的是发放工资的那类正常账户：它们会在短时间内连续付出多笔金额相近、都落在阈值 50%–100% 之间的款项。阈值降到 5,000 后，这些款项更容易落入 TM-02 的条件（24 小时内 ≥ 3 笔、每笔在阈值 50%–100%、合计 ≥ 阈值）。具体是哪个账户，以实验显示为准。<br>拆分规则只看金额和频次，不知道目的。工资发放天然是批量、等额、同一时间段的转账，在形式上与结构化拆分几乎一样。", "你应该看到：跳数从 3 调到 5 并取消在交易所节点停止追溯后，漏报下降（更长的剥离链也能追到），但误报明显上升，因为资金一旦经过交易所这类聚合节点，会混入大量正常资金，更多普通地址被牵连，全网地址都会被标红（章节原话）。<br>作为合规负责人，我会选中间方案：适度提高跳数，保留在聚合节点停止追溯，并结合资金占比做衰减。原因是调查产能有上限，误报过多会淹没分析员，章节也建议用分层阈值，对高风险客户收紧。", "流程可以这样设计：Travel Rule 网关查不到 VASP，就判定为自托管钱包，要求用户证明地址所有权或补充声明（章节的流程图）。通过后放行，并让风控按金额分层，大额再加强审核。<br>对用户体验：多一步验证，提币变慢，部分用户会放弃，要用清晰的提示和较低额度先开放来缓解。对合规：留下了可追溯的所有权声明和记录，满足法规，但无法完全验证对方身份，剩余风险需要靠 KYT 和监控兜底。"], "b02": ["路径：他先把自己控制的地址加进签名白名单，再用审批权限批准一笔提币到这个地址，策略引擎看到的就是“白名单内、已审批”，于是放行，不需要偷私钥。能切断它的是职责分离（SoD）：能加白名单的人不能审批提币。配套的“白名单变更冷却”（新增 &lt; 72 小时不能作大额目标，示例）和“白名单变更必须由第二人确认”也能拦住。", "三项检查：<br>1. 前端产物哈希与发布记录比对，并用 SRI/CSP 防止脚本被换（依赖供应商的前端，只能发现，不能根治）。<br>2. 独立意图校验：用另一套代码解码待签的原始交易，与提币意图比对，不一致就拒绝。<br>3. 签名策略拒绝含 delegatecall 或修改多签配置的交易，必须走仪式流程。<br>第 2、3 项在你自己的签名路径里完成，不依赖供应商；其中独立意图校验最关键。硬件设备上自己解码、显示人能读懂的内容（所见即所签）也属于这类。", "这条规则让止血不用等审批：关闭提币只会影响体验，不会丢钱，所以值班人员单人就能立刻执行；开启提币可能丢钱，所以要两人。按决策树，“能暂停就先止血”是第一步，单人可关就能把这一步缩短到几分钟，而不必等第二个人上线。<br>在 architecture-explorer.html 里，开关应放在提币路径的上游和签名区入口，例如 wallet-service 提交提币意图的位置和签名策略引擎。具体服务名以页面为准。"], "b03": ["还能拦住他的是：1) 异地或新设备二次验证与设备指纹（但钓鱼站实时转发验证码时，这一道可能被漏过）；2) 改密或改 2FA 后的提币冷却（24–48 小时不能提币）；3) 新白名单地址冷却、提币邮件确认和反诈弹窗。另有行为异常评分：登录后 10 分钟内改安全设置会加 30 分。用 Passkey 时，攻击在第一步就断了：Passkey 的签名绑定网站域名，钓鱼域名拿不到有效签名，攻击者无法登录。你在「钓鱼站」剧本里应该看到 Passkey 和反钓鱼码被列为最有效的防线。", "保留 IP 白名单，但让它适应弹性扩容。做法一：把白名单绑到固定出口，例如 NAT 网关或弹性 IP，扩容的机器都从这个出口出去。做法二：只对「提币」权限强制绑 IP，只读和交易权限放宽，并做权限分离。做法三：给交易 Key 加低额度和异常交易监控，白名单修改后设冷却期。依据是第 7 节的平衡建议：开启提币权限必须绑 IP 白名单。", "答案要点：用「Passkey + 新设备二次验证 + 改设置后提币冷却 + 新地址白名单冷却」这类低摩擦组合，通常能覆盖至少 4 个剧本；具体组合以你在页面里看到的拦截数和摩擦分为准。最难拦的是客服冒充：它骗的是用户的信任，由用户自己操作，等于绕过全部技术防线（见 2.2 表和第 7 节「防不住的部分」）。技术上只能靠反诈弹窗、官方验证渠道和用户教育来提醒。"], "b04": ["你应该看到 R2（成交 ↔ 结算）最先变红，因为同一个 <code>trade_id<\/code> 出现了两次结算。关闭 R2 后，资产负债恒等式仍能发现，因为重复入账让用户负债变多而资产没变，等式左右不平。但它只告诉你某个币种总数不平，定位不到单笔业务；等差额触发熔断，用户可能已把多得的币提走。所以越早在 R2 拦住，污染越小。", "它们被归类为“时序差 / 在途”：两边最终都会记，只是时间不同，差额等于某笔在途业务金额，能被在途清单解释，所以只告警 ⚠️，不熔断。熔断条件是差额不能被在途清单解释，且超过阈值或持续 30 分钟。如果在途超时被设为 0，每一笔在途一出现就算超时，立刻升级为工单或不平差额，正常时序差会触发频繁的误停提币，工单也会被淹没。", "因为 R1–R3 只比较订单、成交、结算、账本分录这条业务链，而人工调账是一笔不来自任何业务事件的手工 journal，这几对数据根本看不到它。若调账同时改了流水和快照，R4 也仍然平。要在事前拦住：调账走工单，写明证据，系统校验借贷平衡和金额阈值，复核人必须不同于经办人（四眼原则），用工单号做幂等键，并写只追加的审计日志。对账只能事后发现，审批才是事前控制。"], "b05": ["你应该看到 Recall 上升、Precision 下降。阈值放宽到 10 秒后，存活时间较长的幌骗单也被抓到，所以漏报变少。但同时更多正常订单被命中。正常做市商会频繁报价、撤单、重挂，订单量大、存活短、撤单率高，规则只看这三个条件，看不出意图，所以会被误报。", "新增告警多是“有部分共同特征、但并不真是对敲”的账户。相似度 = 共享特征数 / 全部特征数，降到 0.3 后，只共享设备指纹、IP 段、同一个充值来源或提币地址的账户就会入围。例如同一网络出口的普通用户、同一机构的多个子账户或做市账户，所以应该看到误报明显增多。", "我倾向 14 天（示例推断），并让低风险账户提前放行。理由：作弊者的收益是奖励减去注册养号成本，预算 100 万 USDT 很容易被批量账户套走。1 天内资金归集、关联图等信号还没出现，模型看不准。冷静期越长检测越准，代价是体验变差，所以对低风险账户提前发放，中风险给人工通道，把流失压到最低。"], "b06": ["热钱包约 4 小时耗尽，温钱包再撑约 20 小时。计算（派生数字）：6 小时净流出 1.5 亿 → 每小时 2,500 万；USDT-Ethereum 热钱包 1 亿 ÷ 2,500 万 = 4 小时；温钱包 5 亿 ÷ 2,500 万 = 20 小时。热钱包 4 小时已触及「&lt; 4 小时」告警线。<br>我会先从同链的温钱包补充热钱包，因为同一币种同一链的库存才能直接用；跨到 Tron 再平衡要走发行方换链或跨链桥，更慢也有成本或桥风险，适合作为后续调拨。冷钱包补充要走审批，也要提前启动。", "不能。总值 105% 掩盖了 BTC 单币种 80% 的缺口，按美元总值看「资产 ≥ 负债」是不够的。1:1 储备要逐币种比较，如果 PoR 只给出总值，你应该看不到问题；只有逐币种公开，才能看到 BTC 储备率低于 100%。<br>逐币种重要，是因为用户提的是具体的币：BTC 被集中提走时，其他币种的盈余补不上 BTC（章节中用自有代币冒充 BTC 储备的例子）。", "可以用章节列出的闪兑库存办法：在现货市场或向做市商平盘，把库存卖出；同时降低该币的闪兑额度或调整报价，避免继续累积。也可以分批卖出，减少冲击。<br>代价：卖出时有价差和滑点，量大会压价；向做市商平盘有对手方风险和折价。如果不处理，就要承担币价下跌的敞口（2,000 万美元的库存，价格下跌 20% 就亏 400 万，派生计算）。"], "b07": ["前三个动作：1) 先判断是否资金异常流出，答案是「是」；2) 确认流出限于 TRON 单条链，所以暂停 TRON 全部提币，冻结该热钱包的签名；3) 值班定为 SEV1，5 分钟内拉事件指挥官和安全团队进战情室。因为流出量是平时的 8 倍，超过 5 倍的自动止血阈值。20 分钟后以太坊也异常，说明范围不止单链，决策树走「否或不确定」分支，应暂停全站提币。再判断账本是否可能被篡改：是则全站只读，否则保持交易继续调查。同时轮换密钥并发首次公告。", "两次被盗的钱包类型不同。2019 年币安被盗的是热钱包，攻击者还拿到了 API Key 和 2FA 码，影响面不明，需要全面排查，所以暂停充提约一周，损失由 SAFU 覆盖。2025 年 Bybit 被盗的是冷钱包，热钱包和其他资产仍可用，止血范围与受影响范围匹配，所以不暂停提币。能不暂停还要靠储备：Bybit 向合作方借入 ETH 补足缺口，承诺 1:1 覆盖。没有储备支撑，就不能这样做。", "应定为 SEV2：核心功能受损但资金未受损（章节示例是「某条链充值全部延迟」）。我从章节机制推断：blockchain-indexer 负责监听链上交易，它故障后充值无法入账，提币的链上确认状态也无法回写。你应该看到提币路径出现异常，但没有资金流出。开关建议按「单资产或单链提币暂停」，暂停受影响币种或链即可，不必全站暂停。如果同时出现账实不平且扩大，再升级为 SEV1。本题的具体故障表现请以页面实验为准。"], "b08": ["具体数字以实验为准，你应该看到影子拦截里有一部分是好人，这就是上线前能看见的误杀。回测和影子通常不完全一致，因为回测读的是历史决策日志里的特征快照，影子用的是线上实时特征。可能原因：新特征在线上的取值与离线不同，历史和当前流量分布不同，窗口或时间口径不同。影子拦截率与回测预测偏差超过 2 倍就要告警。", "提币默认从“暂扣”改成“放行”，你应该看到漏放数上升，因为特征库故障期间坏请求也被放走，而链上转账不可撤回。登录从“挑战”改成“拒绝”，误杀数上升，因为所有正常用户被锁在门外，而挑战升级既防攻击者又不锁死用户。下单不应选“拒绝”，因为下单路径本来就不依赖远程特征，全部拒绝等于停止交易。", "我会先切换到预先回测过的“高波动阈值集”，再配合审核队列的溢出策略，不是临时手调。行情剧变时正常用户提币额、登录频率、新设备比例会一起突增，模型把正常行为打成高分。调高阈值能立刻减少告警，代价是召回下降，真正的盗号更容易漏过。增加产能能保住召回，代价是成本高、扩容慢，用户要等更久。"], "b09": ["新加坡禁止向零售提供杠杆和信贷，所以零售的结论是不允许；迪拜 VARA 的合约仅对合格投资者开放，按客户类别放行，不是对零售一刀切。本章点明两者方向相反，所以产品开关要细到“实体 × 产品 × 客户类别”。若用户同时有两地居住证明，应以 KYC 判定的法律居住地来路由实体，不能只看 IP；两者冲突时取更严者，也就是按新加坡零售规则处理，不开放合约。", "页面显示的冲突数以实际勾选结果为准。本章给出的依据是：合约在欧盟需走 MiFID II（MiCA 不涵盖衍生品），英国自 2021 年起禁止向零售销售加密衍生品，香港零售不开放。多申请一张牌照能解决欧盟的 MiFID II 缺口，但解决不了英国和香港这类零售禁令，因为这是对客户类别的禁止，不是牌照缺失。所以无法靠多一张牌照解决的是英国、香港的零售合约。", "欧盟实体：该代币有合规白皮书，且按 MiCA 不属于金融工具，可以通过法律分类、尽调、白皮书核对，经上币委员会批准后进入“按辖区上架”（LIVE）。美国实体：按 Howey 测试被认定为证券，若没有相应牌照则在法律分类处终止，不上架（若已上架则走下架公告 → 只允许提币）。用户从欧盟搬到美国后，KYC 居住地变了，实体路由改到美国一侧，该代币不可交易；本章说明“无可用实体”的用户只能被拒绝或只开放提币，所以他只能提走资产。"], "b10": ["事件序列：<br>1. 3 月充值 2 ETH：转入（Transfer In），成本未知。<br>2. 6 月 1 ETH 换 USDT：加密↔加密兑换，按处置 ETH 报送，同时取得 USDT 并建立成本批次。<br>3. 9 月 USDT 卖成欧元：处置 USDT，报送总收入。<br>交易所不知道成本的是第 2 步里被处置的 ETH，因为它是转入资产。报表要标注“成本未知”，不能填 0。第 3 步的 USDT 成本是交易所自己记录的。", "按流程图，先问“是否存在法律保全标记”。合规团队正在调查那笔充值，所以是：全部保留并记录原因，包括 KYC 证件、交易流水、登录日志，营销偏好也停止使用并保留到保全解除。保全解除后：KYC 证件和交易流水在 AML 留存期未满时停止使用、移入冷存储；税务留存期未满时只保留税务字段。期满后才销毁映射与密钥，账本保留假名流水。", "可以参照 PV-03：单个运营 1 小时内查看 &gt; 50 个不同用户（示例阈值），告警并暂停权限。这个数字要按真实工作量调整，是推断。会误伤处理群体投诉、集中事件的批量排查，还有合规调查的正常工作。缓解办法：这类批量查看要关联工单并经主管预先批准，才可豁免。注意本仓库目前只审计运营写操作，要先把“查看用户资料”也写入审计日志。"], "b11": ["示例工作表（元素：运营后台批量审核 → 提币服务）：<br>S 仿冒：攻击者用被盗的审核员会话批量批准。缓解：批量审核前做 step-up 二次验证。验证：旧会话批量批准必须被要求 2FA。<br>R 抵赖：审核员否认批准过某批提币。缓解：审计日志记录操作人、前后状态、trace_id，写入只追加存储。验证：抽查每笔已批准提币都能追溯到审核人。<br>E 权限提升：单个审核员一次批量批准大额提币。缓解：大额走双人审批。验证：单人批准大额返回 403。<br>对照 docs/security.md 第 3 节：它已经按资产列出“运营审批”，也就是 E（审批权）这一类已被识别；但该节没有逐项编号，也没有验证方式列。", "以下环节都能阻止代码接触签名区：<br>1. 受管设备与 EDR：只有公司管理的设备能访问内部系统，个人电脑上的“测试题”碰不到生产。<br>2. 开发沙箱：陌生代码只能在一次性虚拟机或云开发环境中运行。<br>3. 防钓鱼 MFA（FIDO2）：即使令牌被偷也难以重放。<br>4. PAW 与网络分段：签名区只能从专用工作站访问，日常办公电脑被控也够不到。<br>此外，内部人风险计划和社会工程演练能提高识别“假猎头”的概率。", "凡是会改变余额、冻结、提币状态或签名请求的服务都属于资金路径，应列入 CODEOWNERS 并要求双人评审。按本章数据流图，这包括：提币服务、账本服务、签名策略引擎、MPC 或 HSM 签名，以及能改变提币状态的运营后台审核。风控服务若能决定放行或拦截提币，也建议纳入。API 网关和区块链节点不改变资金状态，通常不在此列。签名策略、权限矩阵、限额配置还必须由安全团队批准。注意：我无法查看 architecture-explorer.html 的具体内容，这里以本章第 4.2 节数据流图为准。"], "b12": ["差异主要来自 L3 密钥层的热钱包限额，其次是发现速度。Coincheck 2018 把全部 NEM（5.23 亿 XEM，约 5.3 亿美元）放在联网热钱包且无多签，损失等于全部持仓，还拖了约 8.5 小时才发现。BingX 2024 同样是热钱包被盗，但损失被热钱包余额封顶在约 4,400 万美元，并靠紧急迁移、暂停提币和自有储备兜底。两者相差约 12 倍。<br>结论：热钱包被入侵不可避免，限额让它不致命。", "三条条件示例：①签名前由我方独立解码交易，含合约升级、delegatecall、多签配置变更时拒绝签名；②供应商员工终端要强认证和管控，禁止运行未签名脚本（DMM 的入口是供应商员工被假招聘骗跑恶意脚本）；③联署或审批不能由 API 自动触发，供应商要有独立判断。第 ① 条不依赖供应商诚信：校验器在我方侧，不信任供应商界面，WazirX 和 Bybit 的界面显示都是假的，再多的签名人也没用。热钱包限额同理，也由我方自己控制。", "P3 用的是员工的合法权限，不涉及签名私钥，所以 L3 只能算辅助（◐）：Coinbase 2025 被收买的外包客服复制了客户数据，没有一笔链上转账要签名。矩阵里 P3 的主防线是 L0（最小权限、访问量基线、内部威胁监控），Coinbase 也是靠监控发现无业务需要的访问。我认为只凭事实描述可以区分：被付钱收买、员工自己主动是 P3；被假招聘或钓鱼骗走终端与凭证、员工并非本意是 P4（如 CoinDCX）。若描述只写“员工凭证被外部控制”，就区分不了，要看入口是收买还是欺骗。"], "c01": ["不会。你们的买卖只改变了交易所的内部账本，链上没有发生任何转账。本章说：你在交易所里买卖时，链上没有发生任何转账，只有交易所的账本变了。<br>只有充值和提币这两步才涉及区块链。买卖双方的 BTC 其实仍存放在交易所的热钱包或冷钱包里，账本里的归属变了而已。", "这说明账实不符：账本里多了 20 万 USDT 的数字，链上没有对应资产，用户无法全额提币。本章说账本余额之和应小于或等于链上资产，这个关系就是储备证明要证明的事；如果交易所挪用资产，就是 FTX 2022 的情况。<br>在 proof-of-reserves.html 里，你应该看到储备率只有 80%（80 ÷ 100，派生计算），低于 100%，验证不通过。", "你应该看到这一笔「下单成交」修改了两本账：内部账本（下单冻结、成交后互换资产）和撮合订单簿（挂单进入、成交后移除或减少）。第一本账链上资产没有变化，因为场内交易不碰钱包。<br>这也是本章的核心：交易在内部完成，只有充值和提币才动链上。若实验显示的步骤略有不同，以实验为准。"], "c02": ["因为撮合追求快，账本追求对，两者必须拆开。撮合在内存里微秒级完成，账本写入要等数据库事务提交。如果撮合直接改余额，撮合会被数据库拖慢；撮合宕机或重放日志时，余额可能被重复修改或丢失；账本也不再是唯一的资金事实源，难以审计。所以撮合只输出成交结果，由结算服务写双分录账本。", "你应该看到：用户资金是正确的，但用户看到的可能是滞后的。因为账本在 Kafka 之外已经同步写完，冻结和结算都不依赖 Kafka。Kafka 只承载行情推送、余额推送、报表等异步事件，故障时事件堆积，用户会看到“订单已成交，但余额和成交推送延迟”。Kafka 恢复后消费者追上，页面自动恢复。", "因为每笔成交都要给手续费账户记一笔，大量并发更新同一行，行锁竞争严重。拆成 16 个子账户后，写入分散到 16 行，竞争下降。代价是对账时要把 16 个子账户的余额和分录汇总，核对总和等于应收手续费，并保证每笔手续费只落入其中一个子账户、不重复不遗漏。"], "c03": ["最多约 60 秒（60000 毫秒），再加网关允许的未来 1 秒左右偏差。超过 recvWindow 后，timestamp 落在时间窗外，网关会拒绝。若订单带了 newClientOrderId，窗口内的重放会因客户端订单号重复而被去重，不会产生第二笔订单。所以 recvWindow 只缩短重放窗口，真正消除重复下单靠 newClientOrderId 幂等。", "攻击者能登录，但不能马上提币。他可以尝试添加自己的新地址，这会触发邮件确认和 24 小时冷静期；冷静期内不能向该地址提币。平台最有机会拦截的环节是“添加新地址”到“提币”之间：用户收到告警后可以冻结账户。示例规则：新设备登录且 24 小时内新增地址，并发起大额提币，则转人工审核或直接拒绝。好的规则应同时组合设备、地址年龄和金额。", "因为子账户继承主账户的 KYC，实名身份只有一个，不需要重复核验。若允许子账户直接向外部地址提币，资金可以在多个子账户之间拆分，用多个出口地址流出，绕过主账户层面的限额和监控，难以追踪是谁在转移资金，也让反洗钱筛查和风控规则失效。所以资金应经主账户流出，在同一实名主体下统一管控。"], "c04": ["单笔充值上限应低于攻击成本 2 万美元，才算安全。原因：重组双花的收益约等于被骗走的充值额，攻击者只有在「收益 &gt; 成本」时才划算。重写 6 个区块要花 2 万美元，所以单笔上限要压到 2 万美元以下，并留出安全边际（例如几千美元，具体数字是推导值）。大额充值则要提高确认数或等 finalized。你应该看到阈值调高后，重组损失变小，但等待时间变长。", "代价出现在提币体验和运营上。热钱包只放 100 BTC，日常提币和高峰提币容易触及下限，要从温钱包或冷钱包补充；补充需要多人审批和多签/MPC 签名，有延迟，用户会遇到「提币排队」。同时调拨更频繁，人工成本更高。你应该在水位实验里看到：上限降低后风险暴露量下降，但提币等待增多。这是安全和体验的权衡。", "只用 Merkle 证明，用户发现不了。每个用户只验证自己的叶子到根的路径，假账户的叶子在别处，不影响你的路径。它会把总负债压低 1000 BTC，而 Merkle 树本身不检查余额是否非负。zk-SNARK 额外证明每个叶子的余额都非负，并证明叶子总和等于公布的负债总额。-1000 BTC 的叶子通过不了非负检查，会被发现。"], "c05": ["你应该看到“借贷平衡”（Σ借 = Σ贷）先变红，因为这一笔 journal 只有买方、卖方等分录，漏了手续费收入那一条贷方，借方合计大于贷方合计。随后“资产 = 负债 + 权益”也失败：用户负债已经减少了手续费这部分，但平台手续费收入（权益）没有增加，负债加权益的合计就比资产少了这一笔手续费。", "系统靠幂等键和对账发现：幂等键的唯一索引会拦截重复入账；关闭后，要靠撮合与结算对账、冻结对账发现多记的成交（冻结可能变负）。每个 journal 自身平衡，说明借贷平衡检查看不出这类错误。没有这项检查时，重复事件会让用户 A（买方）多收币，对手方多扣币，A 可以拿这些凭空多出的余额去交易或提币，造成平台资不抵债。", "我会读汇总表看日常报表，需要精确值时对 64 个桶求和。直接求和读到的是各桶当前快照，数据最新；汇总表由后台任务每隔 T 秒汇总，有延迟。所以在两次汇总之间，也就是刚有成交写入桶、汇总任务还没跑时，两者数值会不同；汇总任务完成后应当一致，不一致说明汇总漏记或重复，需要排查。"], "c06": ["订单簿不会有任何变化，订单状态是 EXPIRED。FOK 要求必须全部立即成交，否则整单取消、一笔也不成交。如果不预演，引擎会边吃边成交，吃到一半才发现量不够，已成交的部分就收不回来。所以引擎先累加对手盘所有可成交数量，总量小于订单数量就直接取消，不修改订单簿。你应该看到卖盘原样保留，没有成交记录。", "系统会拒绝这个订单，订单不进入订单簿，也不成交。因为买价高于卖一价，订单一到达就会立即成交，违反 Post-Only「只做 Maker」的约束。本仓库的实现里，订单簿不变，订单记为 rejected 并解冻全部资金。做市商需要它，因为 Maker 手续费通常低于 Taker 手续费，Post-Only 能保证自己的挂单不会意外变成 Taker。", "不会一致，重放结果可能和原结果不同。撮合必须是确定性的：相同的初始状态加相同顺序的输入，才能得到逐字节相同的订单簿和成交记录。Math.random() 每次给出不同的同价订单顺序，会破坏这一点。你应该在页面里看到重建结果与当前订单簿对不上。后果是故障恢复、主备切换和审计对账都不可靠。"], "c07": ["你应该看到 A 的 USDT 冻结正好为 0。因为每次成交都按 A 的限价 60000 扣冻结，三次成交量加起来是 0.1 BTC，扣减合计 6000 USDT，等于下单时冻结的数额。若价格或数量位数很多，要用最小单位的整数或定点数计算（不能用浮点），否则会出现 0.00000001 级的尾差。本章没有规定尾差归属，只要求舍入方向统一（如向下取整）并写进文档；方向不一致，尾差会累积成对账差额。", "按币安费率表推算：<br>同时满足：交易量 2,500 万 ≥ 500 万，BNB 50 ≥ 25，但 VIP 3 要 BNB ≥ 100，不够，所以是 VIP 2（Maker 0.08%，Taker 0.10%）。月手续费（假设全部为同一方向、不开 BNB 抵扣）= 2,500 万 × 0.08% = 2 万 USD（Maker），或 × 0.10% = 2.5 万 USD（Taker）。<br>满足任一：交易量已满足 VIP 3（≥ 2,000 万），升到 VIP 3（Maker 0.04%，Taker 0.06%）。月手续费 = 1 万 USD（Maker）或 1.5 万 USD（Taker）。以上为推算值，页面计算器的具体显示以实际为准。", "两个途径：①引流到收费产品。用户为免费的 BTC 交易对进入平台后，会使用合约、理财等收费产品（第 3.7 节）。②其他交易对继续收费。2022 年只有 13 个 BTC 现货交易对免费，其余现货对仍按原费率收手续费。此外 BNB 抵扣也让用户持续需要平台币。请打开 revenue-model.html，核对合约、理财等收入项是否在其中，以确认这些途径。"], "c08": ["会丢失「快照生成之后、WebSocket 连接建立之前」这一段的增量事件。时间线：t1 拉快照（lastUpdateId = 107）→ t2 开 WebSocket，收到的第一个事件可能是 U=111。事件 108–110 既不在快照里，也没被你收到，本地簿从此缺口，深度失真。正确顺序是先开 WebSocket 缓存事件，再拉快照，然后按 <code>U &lt;= lastUpdateId+1 &lt;= u<\/code> 对齐，并丢弃 u 不大于 lastUpdateId 的旧事件。", "你应该看到：流动性最薄时，大额市价单会吃穿多个价格档，滑点很大；切换「做市商撤单」后，盘口更空，滑点进一步变大（具体增加多少请以实验页数字为准）。风险是依赖最新价做强平的系统：薄盘口里一笔大单就能让最新价瞬间偏离，用它强平会错误强平很多人。所以合约强平用指数价格和标记价格，而不是单一交易所的最新价。", "开盘价 O 和收盘价 C 不会错，因为它们取第 1 根的 O 和第 60 根的 C，第 37 根不是首尾。可能出错的是三项：成交量 V 会偏小（求和少了一根）；最高价 H 可能偏低，如果这一分钟是全小时最高；最低价 L 可能偏高，如果这一分钟是全小时最低。合并规则是 O 取第一根、C 取最后一根、H 取最大、L 取最小、V 求和，缺一根只影响后三项。"], "c09": ["你应该看到：限额越低，拦截越多，漏放率下降，误杀率上升，人工审核队列变长，因为更多正常提币也超过阈值被转人工。让“误杀率 + 漏放率”最小的阈值不在两端，而是在中间某个位置，具体数值以实验页显示为准。选阈值时还要权衡队列积压：正常用户等待数小时，体验等同于误杀。", "你应该看到漏放率明显上升（具体数值以实验页显示为准），因为盗号者改密后立刻提币，原本正是被“改密冷却”这条硬规则拦住的。这说明账户风控的信号（刚改密、新设备）会流入资金风控，是盗号防御的关键。只靠提币限额和评分，不知道账户刚被动过，就很难区分盗号者和正常用户。", "固定窗口下，2 秒内服务端会收到 240 次请求：第 59 秒用满第一个窗口的 120 次，第 61 秒进入新窗口，计数清零，又放行 120 次，也就是窗口边界允许约 2 倍突发。令牌桶（速率 2 次/秒，容量 120）：第 59 秒桶满，120 次取空；到第 61 秒只补回约 2×2=4 个令牌（推算），所以共放行约 124 次，其余被拒。"], "c10": ["杠杆越高，强平价离开仓价越近，但不是简单的反比。用简化公式：多仓强平价 = EP × (1 − 1/L) / (1 − MMR)，距离 = EP − 强平价。<br>10x：45,180.72，距离约 4,819（9.6%）。<br>20x：47,690.8，距离约 2,309（4.6%）。<br>125x：49,799.2，距离约 201（0.4%）。<br>距离占开仓价的比例约为 (1/L − MMR)/(1 − MMR)，即大致随 1/L 线性缩小，再减去 MMR 留出的空间。（以上均为推算值）", "资金费率是 0.01%。F = P + clamp(I − P, −0.05%, +0.05%)，I 默认 0.01%。P = 0.03% 时，I − P = −0.02%，在 ±0.05% 之内，不被截断，所以 F = 0.03% − 0.02% = 0.01%，即 F = I。只要 P 在 −0.04% 到 0.06% 之间，F 都等于 I，所以平静市场常年是 0.01%。<br>P = 0.2% 时，I − P = −0.19%，被截断为 −0.05%，F = 0.2% − 0.05% = 0.15%。", "你应该看到：用最新价会判定强平，用标记价格不会。最新价被一笔大额市价单打穿强平价，就会误伤仓位；标记价格是 价格1、价格2、合约最新价 三者的中位数，单一来源的插针被另外两个值否决，所以不变。<br>但全部现货交易所同时下跌时，不能保护。指数价格会真实下跌，标记价格跟着下跌，仓位照样会被强平。标记价格防的是“假”波动，不防“真”波动。"], "c11": ["应该放进“闪兑/双币价差”这一类，也就是报价与市场价之差，不是现货手续费。闪兑里平台是用户的对手方，报价是“中间价 + 价差 + 风险加价”，价差就是隐含费用。折算成费率后，它就是“零手续费”宣传下平台实际收到的钱，在 revenue-model.html 里不能算进“交易手续费”那一栏。", "以章节示例（目标价 70,000 USDT）计算：到期价为 1.5 倍即 105,000 USDT（推算）。用户只能按 70,000 卖出，相比一直持有 BTC 少赚 105,000 − 70,000 = 35,000 USDT，约为目标价的一半。期权语言：用户卖出了一份看涨期权，买方行权，用户赔付的就是 35,000。用户收到的高利息就是期权费，只能补偿很小一部分。", "申诉期间资产保持冻结，买家付了法币却拿不到币，卖家的币被占用 7 天，两边都承担价格波动和资金占用成本。平台要承担仲裁人力、纠纷和声誉成本，因为它无法直接验证银行转账。一条示例规则：新注册账户的买家大额下单时，限制单笔额度并延长放币前的观察期，同时对短时间内多次被申诉的账户提高风险评分并转人工审核（推断）。"], "c12": ["按本章的 25% BNB 折扣（截至 2026 年公开资料），使用率 80% 时毛手续费约下降 25% × 80% = 20%（推算值，以页面显示为准）。平台仍愿意给折扣，因为用户用 BNB 付费会增加 BNB 需求，持有 BNB 的用户转向其他平台的成本更高，被锁定在生态里。折扣的成本是少收的手续费，回报是留存和生态粘性。", "这道题的结果要在页面里运行 12 期才能看到，本章正文没有给出具体数字。可以先估算：费率从 0.10% 降到 0.06%，每单位成交额的收入少 40%，需要成交额增长约 0.10/0.06 ≈ 1.67 倍才能不亏，再扣掉补贴。你应该看到：降费加补贴的方案只有在飞轮带来足够的交易量增长时才赢。结果最敏感的是降费和补贴拉动交易量的程度。", "更像固定成本，或随地区数量增长的阶梯式成本，不太像随交易量增长的变动成本。章节说合规是“进入市场的门票”，很难压缩，随业务地区数量增长，技术则是固定成本为主。所以小型交易所收入少，合规占收入比例很高，难以承担。大型交易所把它分摊到巨大的交易量上，规模优势更明显，这也会抬高行业门槛。"], "c13": ["不能发现。PoR 只证明「某一时刻」的资产不少于用户余额总和。平台在快照前临时借入资产，快照时看起来资产充足，快照后还回去，PoR 仍然通过。你在实验里应该看到：把借入资产计入储备后，储备率达标。章节还指出 PoR 不能证明没有隐藏负债。补充机制：独立审计（含负债完整性）、多次不定期快照、客户资产隔离、日常账实对账，以及监管要求的托管分离。", "切换后热备应先回放日志到最后一条已持久化指令，即 seq=1005（补上 1004、1005），校验订单簿哈希，再宣布成为主节点，从 seq=1006 开始。订单服务会重发未确认指令，热备按 seq 去重，已处理的跳过，避免重复成交。如果 seq=1005 没有持久化，热备只能回放到 1004，从 1005 开始接任；这条指令在日志里不存在，需要靠订单服务重发未确认指令来补上，按 seq 去重后只处理一次。（这一点是依据章节的去重规则推出的。）", "被突破的是账户层和风控层：攻击者用钓鱼拿到大量用户的 API 密钥和 2FA，批量提币，风控没识别出「多个账户在短时间内协同提币」。密钥层（平台私钥）没有被突破。限制损失的是热钱包限额：热钱包只放日常提币所需资产，损失约占 BTC 总持仓的 2%，之后 SAFU 基金全额覆盖。拦截规则示例：同一时间窗口内（如 10 分钟），提币总额超过热钱包余额的某比例，或多个账户向同一新地址提币，就暂停并转人工复核（四眼审批）。阈值按实验页调试。"], "p01": ["一致。1,000 本金借 2 倍即 2,000，在 50,000 买入 0.06 BTC。追保价 = 1.3 × 2,000 / 0.06 = 43,333.33（跌 13.3%）；强平价 = 1.1 × 2,000 / 0.06 = 36,666.67（跌 26.7%），与 1.5 节表格相同。<br>改为借 4 倍：负债 4,000，总资产 5,000，持币 0.1 BTC，强平价 = 1.1 × 4,000 / 0.1 = 44,000（跌 12%，为推导值）。强平价离开仓价只剩 6,000，比之前的 13,333 近了约 7,333，约 14.7 个百分点。", "你应该看到：拐点降到 60% 后，利率更早进入陡升段，挤兑时在同样的利用率下利率更高。按本章示例参数（基础 1%、斜率1 6%、斜率2 60%，为推导值）：U = 95% 时利率由 52% 升到约 59.5%；U = 100% 时的最高利率都是 67%，所以主要变化是陡升来得早。<br>对存款人：存款利率上升得更早，更能吸引资金，但更早进入取不出钱的危险区。对借款人：更早面对高利率，借款成本和强平压力更大。", "因为两者的计算范围和风险对象不同。杠杆账户（全仓）是全账户多资产共同担保，要用保证金水平（ML），抵押物还要折算，并按小时计息；Binance Loans 是单一质押物对一种借出币，每个组合独立，相当于逐仓，按分钟计息，要看 LTV。每个币对的初始、追保、强平线不同，小币种阈值更严。对单一仓位 ML = 1/LTV 才近似等价，91% 对应 1.099。多资产组合和单仓位不能共用一套指标。"], "p02": ["你应该看到：打开毒性流量后，平台的平均每笔盈亏下降，甚至转负，因为毒性用户只在外部价格对自己有利时才接受报价，平台等于卖了一份免费期权。把有效期缩到 3 秒，能减少“等待有利变动”的时间，直接降低逆向选择损失；价差加到 8 bps，则要求价格变动超过更大的幅度才值得接受。哪个更有效要以沙盘数值为准。<br>对正常用户的伤害：加价差是所有用户都多付，缩短有效期只是让手慢的用户需要重新报价，通常伤害更小，但体验会变差。", "滑点要在 depth-slippage.html 里用该币种的订单簿深度读取，我不能凭空给出数字。方法：把 1,000 万 USDT 沿卖单逐档吃下，计算平均成交价相对中间价的偏离，这就是滑点。报价里的冲击成本至少要覆盖这个估计，再加持仓风险溢价（对冲要几小时，示例见本章的 0.10% 和 0.05%）。<br>如果客户同时问 5 家平台，赢得报价的往往是报价最差的平台（赢家诅咒）。应跟踪客户的询价成交比，对这类客户报得更保守，或在行情不稳时只报指示价，缩短有效期。", "这条规则拦截的是“被盗卡买币后立即提走”的拒付欺诈：真实持卡人几周后拒付，币早已被转走，平台承担损失。误伤的是正常的新用户，例如急着把币转到自己钱包的人。<br>更精细的替代规则（示例）：按风险评分分层。设备或卡 BIN 异常、账户很新、金额大的订单才设置冷却期；已通过 3DS 且账户老、历史干净的用户，缩短冷却期或设提币限额；同一设备多张卡、多次小额授权失败则直接收紧。好的答案应写清触发条件、动作和对正常用户的影响。"], "p03": ["你应该看到币已划转给买家，且不可逆，因为卖家没核对银行就点“放币”，放币要卖家 2FA 且无法撤销，而假截图没有真实付款。平台还能做的有限：冻结买家剩余资产、封禁买家、配合调查，卖家追回的成功率低。对比卖家先申诉：订单进入申诉并锁定，币保持冻结，卖家提交银行流水录屏，仲裁员据此判定未付款，币解冻退回卖家，买家受处罚。", "因为买家可能真的已经付款。自动退币会让买家钱和币两空，所以进入“已标记付款”后只能走申诉。自动取消只发生在“待付款”，把超时风险留给买家。如果改成自动取消，“卖家收款后不放币”这类欺诈会变得容易：恶意卖家收到钱后故意拖延或失联，等订单超时，币自动解冻退回，他就钱币两得，而买家只能追讨。现在的设计让这种订单停在“已标记付款”，买家可以申诉强制放币。", "盈亏平衡条件：该用户第一年为平台贡献的手续费净收入，加上 P2P 广告方手续费分摊，要不低于平台分摊到他身上的 P2P 成本（客服仲裁人力 + 风控 + 商家保证金管理 + 合规）。本章没给出具体成本数，下面是假设的示例：若分摊成本为 10 美元，现货与合约综合手续费净留存率为 50%，则该用户第一年需要贡献约 20 美元手续费才回本。关键是 P2P 本身不赚钱，值不值取决于下游现货、合约、理财的转化。"], "p04": ["现货多 1 BTC + 永续空 0.5 BTC，净敞口是多 0.5 BTC。−15% 情景：现货亏 60,000 × 15% × 1 = 9,000，空头赚 4,500，净亏 9,000 − 4,500 = 4,500 USDT；+15% 情景净赚，不是最差。所以最差亏损为 4,500 USDT（忽略附加项）。完全对冲的净敞口为 0，最差亏损约 0，所以半对冲多需要约 4,500 USDT 保证金（派生值）。", "初始保证金 = 标记价 + 9,000 USDT。K = 60,000 时虚值额 = 0；15% × 60,000 − 0 = 9,000，10% × 60,000 = 6,000，取大者 9,000。标记价取章中平值 7 天、IV 50% 的近似权利金约 1,662，则约 10,662 USDT（派生值，实际按标记价）。平值卖方保证金更高，因为虚值额为 0，不再抵减，且平值期权被行权的可能性更大，权利金也更高。", "你应该看到，100 BTC（按 60,000 约 600 万 USDT 名义）被强平时，要一次性卖出或买入一大笔，吃掉订单簿多档深度，成交价大幅偏离标记价。没有分层时，MMR 固定为 0.4%，大仓位的强平线和小仓位一样晚，缓冲很小，强平单就可能砸穿订单簿，造成穿仓、耗尽保险基金并触发 ADL。结合 depth-slippage 实验，订单越大滑点越大。分层让大仓位更早强平、部分强平，并配合持仓上限控制强平单规模。"], "p05": ["借款利率和活期 APR 都会上升。理财基础 APR = 借款利率 × 使用率 × (1 − 平台抽成)，使用率 U 升高时，借款利率 f(U) 变大，U 本身也变大，两项相乘，所以 APR 同步升高；你应该看到借款利率在高使用率区间明显变陡（具体曲线以页面为准）。平台这样做，是因为使用率接近上限时，资金池可供赎回的缓冲很少。陡升的利率让借款人主动还款，资金回流，降低挤兑时无法兑付的风险。", "排队赎回成本更低，但要等待。排队赎回按汇率算：10 × 1.08 = 10.8 ETH，成本是等以太坊退出队列的时间（数天到数周）和等待期的价格风险。市场卖出立刻到手：10 × 1.03 = 10.3 ETH，比赎回少 0.5 ETH（约 4.6%，推导值）。风控应以汇率为基准、市场价为参考估值。订单簿价格在流动性枯竭时不可信，2025-10-10 就因此引发强平。还要加折扣率，因为赎回排队期内汇率无法立即兑现。", "用幂等键重跑，并先对账。1) 每个用户每天一条分录，幂等键为 <code>interest:{userId}:{productId}:{date}<\/code>，已发的人重跑时被跳过，没发的人补发。2) 重跑仍读 00:00 的持仓快照，不读实时余额，保证金额一致。3) 汇总全部利息，与「平台-理财利息支出」科目核对，相等后才提交批次。4) 如果已经重复发了，就用冲回分录纠正，不修改历史流水。"], "p06": ["你应该看到 APR 下降，被换成 BTC 的概率也下降。低买的目标价远离当前价，等于你承诺的“接货价”更难被碰到，期权更便宜，APR 就低。用卖保险比喻：出险线定在更低的位置（90,000），出险概率小，保费（APR）也低；出险线贴近当前价（99,000），随时可能出险，保费高。目标价越接近当前价，期权越值钱，APR 越高，被换币的概率也越高。", "你应该看到 APR 升高，但最坏情形的损失不会因此变小。IV 越高期权越贵，用户卖出期权收到的“保费”才变高；但被行权时，用户仍按目标价接下已经贬值的 BTC，下行损失没有减少，且大幅下跌的概率更高。例如章节里 IV 从 40% 升到 60%，公允 APR 从约 28.5% 升到约 73.9%。高 APR 往往出现在市场恐慌、IV 最高的时候，此时下跌风险也最大，所以高 APR 的时刻最危险。", "用户拿回约 1,057.35 USDT，比一直持有 BTC 少赚约 142.65 USDT。（均为推算）<br>y = 36.5% × 7 ÷ 365 = 0.7%，本息 = 0.01 × 1.007 = 0.01007 BTC。<br>到期价 120,000 ≥ 目标价 105,000，被行权：0.01007 × 105,000 = 1,057.35 USDT。<br>一直持有 0.01 BTC 值 1,200 USDT，差额 1,200 − 1,057.35 = 142.65。<br>看涨期权赔付公式：用户卖出 Q(1+y) 份看涨期权，赔付 = Q(1+y) × max(P − K, 0) = 0.01007 × 15,000 = 151.05 USDT；减去利息折算 0.00007 BTC × 120,000 = 8.40，就得到 142.65。"], "p07": ["年化降到原来的 1/4，下降约 13.7 个百分点。按章节示例（我 10 BNB，每小时奖励 50,000 NEW，其余不变）：全池 2,000,000 时年化 18.25%；全池 8,000,000 时，份额 = 10 ÷ 8,000,000 = 0.000125%，每小时奖励 0.0625 NEW，年化 = 18.25% ÷ 4 ≈ 4.56%。（后两个数为推算。）原因是每小时奖励总量固定，按「我的均值 ÷ 全池均值」分，后来者让分母变大，先来者的份额就被稀释。", "平均持仓从 1 BNB 升到约 5.17 BNB，只提高约 4.17 BNB。计算：(138 × 1 + 6 × 101) ÷ 144 = 744 ÷ 144 = 5.17。临时充入的 100 BNB 只占 144 次快照中的 6 次。如果快照只在计算期最后一刻取一次，平均持仓就是 101 BNB，临时资金完全算数，快照取平均防操纵的效果消失。", "HODLer 的快照窗口在公告前已经结束，临时资金完全无效，因为公告后再买入 BNB 也赶不上窗口；长期持有者什么都不用做就按窗口均值拿份额（单人份额上限为全池 4%）。Launchpool 是公告后开始的活动，用户要主动锁仓，资金可以随时进出，但小时内多次随机快照取平均，临时资金只拿到按时间比例折算的奖励（例如最后 15 分钟锁入只拿约 1/4）。所以回溯空投更偏向长期持有者，Launchpool 对短期资金仍有一定吸引力。"], "p08": ["震荡行情网格胜出，单边上涨行情一直持有胜出。震荡时价格反复穿越网格线，往返次数多，网格利润持续累积，浮动盈亏接近 0。单边上涨时价格突破上限（OutOfRangeUp），网格把币全部卖出，只剩 USDT，不再享受后面的涨幅；一直持有则吃满上涨。网格赚的是波动，不是趋势。", "每格利润率变小，网格越密越薄。以 80–120 等比网格为例（推算）：N=10 时 r=1.04138，利润率 3.934%；N=200 时 r=1.5^(1/200)≈1.002029，利润率 = 0.002029 − 0.001×2.002029 ≈ 0.0027%，几乎为 0。利润率小于 0 的条件：r − 1 &lt; f(1 + r)，即 r &lt; (1+f)/(1−f) ≈ 1.002002，约 N ≥ 203。等差网格则在高价区先变负：每格涨幅约 0.2/P，到 P 约 100 以上就小于双边费率约 0.2%。", "因为跟单子订单集中在带单员成交之后，同一方向、同一时刻涌入，会推高（或压低）成交价，产生滑点。资金越大，价格冲击越大。章节示例：带单员成交 100.00，跟随者平均成交 100.06，100 万 USDT 的单向成本 = 0.06% × 1,000,000 = 600 USDT（示例）。所以跟单资金越大，跟随者收益率越低于带单员。平台设置上限，是因为资金过大时子订单本身就会移动价格，带单员的策略不再可复制，并且延迟与风险也会集中放大。"], "p09": ["Pay 转账只需一笔划转，两条分录：借 A，贷 B。礼品卡有两步：创建时冻结（并收创建手续费），兑换时消耗冻结再划转给兑换者，分录更多。需要冻结，是因为兑换码在站外传递，兑换前这笔钱必须仍属于创建者但不能再动用，否则创建者可以把币花掉，兑换者拿着码却兑不到钱。", "损失由兑换者承担。礼品卡锁定的是币，不是法币价值，BTC 贬值时平台不承担这部分风险，兑换者拿到的 BTC 折合只有 80 USDT。若改为按 USDT 计价、兑换时换成 BTC，平台就要在兑换时按 100 USDT 价值交付 BTC，创建到兑换之间的 BTC 价格波动变成平台的风险，需要对冲或预留头寸。", "本章只说“退哪种取决于产品规则”，并指出退货通常以法币或稳定币退回，用户承担期间价格变化。按这个思路：<br>退 EUR：平台手里本来就是 EUR，几乎无风险；用户失去 BTC 敞口，BTC 若上涨就吃亏。<br>退 USDT：平台要多做一次兑换，有小额汇率风险；用户拿到稳定币，同样不再持有 BTC。<br>按原价买回 BTC：用户最公平；平台承担授权到清算期间的价格变动，BTC 涨了要亏。"], "p10": ["你应该看到：在第 ② 步“链上转账，等同提币”完成、资产到达你的 Web3 钱包地址之后，这笔资产就不再出现在储备金证明里。因为第 ① 步账本扣减后，币安热钱包把币转到你的地址，资产变成链上归你签名的地址余额，币安账本不再记录，储备金证明也不包含它。反方向转回，则要等确认数达标，才作为充值入账。", "不能保证。2-of-3 在数学上任意两片可以签名，但本章指出：设备分片加云备份分片能否独立签名，取决于恢复方案设计，币安只公开说明“至少需要两片”，灾备流程以官网为准；本章描述的恢复路径是云备份分片加币安分片重新分片。所以“自托管”不能只看“币安不能单独动钱”，还要看币安服务停止后用户能否自己签名。MPC 钱包是“无私钥”，但签名能力仍可能依赖币安服务，它不等于助记词钱包的完全自托管。", "你应该看到：容忍度从 0.5% 调到 5%，三明治机器人能抽走的利润上限也随之从约 0.5% 放大到约 5%。因为机器人先买推高价格、再卖出，只要用户的成交价仍在容忍度之内，用户的交易就不会失败。本章说，2% 的容忍度就是 2% 的潜在损失上限。示例：1,000 USDT 的买单，上限从约 5 USDT 变成约 50 USDT，多约 45 USDT（为推导值，实际取决于池子深度）。"], "p11": ["需要新增约 33% 的交易量（推算值）。以章节示例，每 10 USDT 手续费，返佣 20% 时平台净收入 8 USDT；提到 40% 后只剩 6 USDT。假设营销支出不变，要保持总净收入不变，交易量需乘以 8 ÷ 6 ≈ 1.33。你在 revenue-model.html 里提高营销支出，所需增量会更大。", "“先扣自有资金”对平台成本更低，“先扣体验金”不容易引起投诉。体验金的实际亏损额是平台的营销支出，先亏自有资金，体验金留着，到期还能收回。但用户会觉得“我自己的钱亏光了，体验金还剩着”，这正是章节说的争议。无论哪种，扣款顺序都必须事先写进规则。", "做市商可以在平时保持 100% 在线，在行情最剧烈的几分钟集中撤单，周平均仍能达标，例如门槛 90% 时全周可以有约 10% 的空档（推算）。这样规则合规，订单簿却在最需要流动性的时刻变薄。我会加“极端行情在线率”（波动率超阈值期间挂单时间占比，示例 ≥ 70%）、最小挂单深度、最大价差，并用订单成交比监控过度撤单。"]};
/* ---------- 学习层：学习状态、笔记、高亮、思考题作答、复习队列、学习台 ----------

(() => {
const L = {};
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addDays = (n, from) => { const d = from ? new Date(from + 'T00:00:00') : new Date(); d.setDate(d.getDate() + n); return today(d); };
const IVL = [1, 2, 4, 7, 15, 30, 60];
const STATUS = { 0: '未开始', 1: '在读', 3: '已读', 2: '已掌握' };
const ORDER = [0, 1, 3, 2]; // 3 = 读完但还没掌握；不进入复习队列

  ['w3hb', 'Web3 从 0 到 1', 'https://claude.ai/artifact/PBJN64zKKK7eQEdvntySLE'],
  ['sca', '合约审计 101', 'https://claude.ai/artifact/NqWHfGnuG6Rr5VqWyaNThF'],

let C, S, N, mode = 'local', db = null, uid = null, curId = null, lastTick = Date.now(), lastAct = Date.now();

/* ---------- storage ---------- */
const lsKey = () => 'll:' + C.key;
function blank() { return { v: 1, ch: {}, days: {}, last: null, up: 0 }; }
function loadLocal() {
  try { const o = JSON.parse(localStorage.getItem(lsKey()) || 'null'); if (o && o.S) { S = o.S; N = o.N || {}; return; } } catch (e) {}
  S = blank(); N = {};
}
function saveLocal() { try { localStorage.setItem(lsKey(), JSON.stringify({ S, N })); } catch (e) {} }
const docIdFor = id => 'n_' + String(id).replace(/[^A-Za-z0-9_\-.~:@+]/g, '_');
const pending = new Set(); let flushT = null, busy = false;
function touch(what) {
  S.up = Date.now(); saveLocal();
  if (mode !== 'cloud') return;
  pending.add(what); clearTimeout(flushT); flushT = setTimeout(flush, 1500);
}
async function flush() {
  if (busy || mode !== 'cloud' || !pending.size) return;
  busy = true;
  for (const what of [...pending]) {
    pending.delete(what);
    const isState = what === 'state';
    const body = isState ? S : N[what];
    if (!body) continue;
    try { await db.doc(`data/users/${uid}/${isState ? 'state' : docIdFor(what)}`).set(JSON.parse(JSON.stringify(body))); }
    catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { mode = 'readonly'; break; }
      if (e && e.code === 'quota_exceeded') { mode = 'readonly'; toast('云端空间已满，新的更改只保存在本浏览器。'); break; }
      pending.add(what);
    }
  }
  busy = false;
  chip();
  if (mode === 'cloud' && pending.size) flushT = setTimeout(flush, 4000);
}
function mergeState(a, b) { // per-chapter newest wins
  const out = blank();
  const ids = new Set([...Object.keys(a.ch || {}), ...Object.keys(b.ch || {})]);
  ids.forEach(id => { const x = (a.ch || {})[id], y = (b.ch || {})[id]; out.ch[id] = !x ? y : !y ? x : ((x.u || 0) >= (y.u || 0) ? x : y); });
  const days = new Set([...Object.keys(a.days || {}), ...Object.keys(b.days || {})]);
  days.forEach(d => { out.days[d] = Math.max((a.days || {})[d] || 0, (b.days || {})[d] || 0); });
  out.last = (a.up || 0) >= (b.up || 0) ? a.last : b.last;
  out.up = Math.max(a.up || 0, b.up || 0);
  return out;
}
async function connect() {
  if (!window.claude || !window.claude.use) { chip(); return; }
  try {
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    const id = u && await u.id();
    if (!d || !id) { chip(); return; }
    db = d; uid = id;
    const snap = await db.collection(`data/users/${uid}`).get();
    let remoteS = null; const remoteN = {};
    snap.docs.forEach(doc => { const v = doc.data(); if (!v) return; if (doc.id === 'state') remoteS = v; else if (v.ch) remoteN[v.ch] = v; });
    const localS = S;
    S = remoteS ? mergeState(localS, remoteS) : localS;
    const pushState = !remoteS || JSON.stringify(S.ch) !== JSON.stringify(remoteS.ch);
    const pushNotes = [];
    new Set([...Object.keys(N), ...Object.keys(remoteN)]).forEach(k => {
      const x = N[k], y = remoteN[k];
      if (!y) { N[k] = x; pushNotes.push(k); } else if (!x || (y.up || 0) >= (x.up || 0)) N[k] = y; else pushNotes.push(k);
    });
    mode = 'cloud';
    remapIds();
    saveLocal();
    if (pushState) pending.add('state');
    pushNotes.forEach(k => pending.add(k));
    if (pending.size) flushT = setTimeout(flush, 800);
    refreshAll();
  } catch (e) { console.warn('learn-layer db', e); mode = 'local'; }
  chip();
}

// Renamed chapter ids (cfg.aliases: old -> new): move progress and notes once; newest wins.
function remapIds() {
  const A = C.aliases || {}; let changed = false;
  Object.entries(A).forEach(([o, n]) => {
    const x = S.ch[o];
    if (x) { const y = S.ch[n]; if (!y || (x.u || 0) > (y.u || 0)) S.ch[n] = x; delete S.ch[o]; changed = true; }
    const m = N[o];
    if (m) { const k = N[n]; if (!k || (m.up || 0) > (k.up || 0)) { N[n] = Object.assign({}, m, { ch: n }); if (mode === 'cloud') pending.add(n); } delete N[o]; changed = true; }
    if (S.last === o) { S.last = n; changed = true; }
    if (S.last && S.last.id === o) { S.last = Object.assign({}, S.last, { id: n }); changed = true; }
  });
  if (changed) { saveLocal(); if (mode === 'cloud') pending.add('state'); }
  return changed;
}

/* ---------- model helpers ---------- */
function E(id) { return S.ch[id] || (S.ch[id] = { s: 0, u: 0 }); }
function note(id) { return N[id] || (N[id] = { ch: id, title: titleOf(id), text: '', hl: [], ans: {}, up: 0 }); }
function hasNote(n) { return n && (n.text.trim() || (n.hl && n.hl.length) || Object.values(n.ans || {}).some(v => String(v).trim())); }
function chList() { try { return C.chapters() || []; } catch (e) { return []; } }
function titleOf(id) { const c = chList().find(x => x.id === id); return c ? c.title : id; }
function setStatus(id, s) {
  const e = E(id); if (e.s === s) return;
  e.s = s; e.u = Date.now();
  if (s === 2) { e.m = e.m || today(); if (!e.rv) e.rv = { due: addDays(1), step: 0 }; }
  if (C.onStatus) try { C.onStatus(id, s); } catch (x) {}
  touch('state'); refreshAll();
}
function setHard(id, v) { const e = E(id); e.h = !!v; e.u = Date.now(); if (v) e.rv = { due: today(), step: 0 }; touch('state'); refreshAll(); }
function dueList() { const t = today(); return Object.entries(S.ch).filter(([, e]) => e.rv && e.rv.due <= t && (e.s === 2 || e.h || e.qw)).map(([id, e]) => ({ id, e })).sort((a, b) => a.e.rv.due.localeCompare(b.e.rv.due)); }
function review(id, ok) {
  const e = E(id), step = ok ? Math.min((e.rv ? e.rv.step : 0) + 1, IVL.length - 1) : 0;
  e.rv = { due: addDays(ok ? IVL[step] : 1), step, last: today() };
  if (ok && step >= 2) e.qw = 0;
  e.u = Date.now(); touch('state'); refreshAll();
}

/* ---------- time tracking (active reading only) ---------- */
function tick() {
  const now = Date.now(), dt = Math.min(now - lastTick, 30000); lastTick = now;
  if (!curId || document.hidden || now - lastAct > 120000) return;
  const e = E(curId); e.sec = (e.sec || 0) + dt / 1000;
  const d = today(); S.days[d] = (S.days[d] || 0) + dt / 1000;
  const keys = Object.keys(S.days); if (keys.length > 400) keys.sort().slice(0, keys.length - 400).forEach(k => delete S.days[k]);
}
function flushTime() { tick(); if (curId) { E(curId).u = Date.now(); touch('state'); } }
